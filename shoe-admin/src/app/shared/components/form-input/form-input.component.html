<div class="space-y-1.5 w-full">
    @if (label) {
    <label [for]="id" class="block text-xs font-bold text-gray-500 uppercase tracking-wider">
        {{ label }} @if (required) { <span class="text-red-500">*</span> }
    </label>
    }

    <div class="relative">
        <input [id]="id" [type]="type" [placeholder]="placeholder" [ngModel]="value" [disabled]="disabled"
            (ngModelChange)="onModelChange($event)"
            [class]="errorMessage 
        ? 'w-full px-4 py-2.5 text-sm border-2 border-red-300 bg-red-50/10 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-200 transition' 
        : 'w-full px-4 py-2.5 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition bg-gray-50/50 hover:bg-gray-50 focus:bg-white'" />
    </div>

    @if (errorMessage) {
    <p class="text-[11px] font-semibold text-red-500 flex items-center gap-1.5 animate-fadeIn">
        <span class="inline-block w-1.5 h-1.5 bg-red-500 rounded-full"></span>
        {{ errorMessage }}
    </p>
    }
</div>
