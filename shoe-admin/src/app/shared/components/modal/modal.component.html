@if (isOpen) {
<div
    class="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs transition-opacity duration-300">

    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 flex flex-col max-h-[90vh] w-full transition-transform duration-300 scale-100"
        [ngClass]="{
           'max-w-md': size === 'sm',
           'max-w-lg': size === 'md',
           'max-w-2xl': size === 'lg'
         }">

        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
            <h3 class="text-lg font-bold text-gray-800">{{ title }}</h3>
            <button (click)="onClose()"
                class="text-gray-400 hover:text-gray-600 transition-colors text-lg font-bold p-1">
                ×
            </button>
        </div>

        <div class="px-6 py-5 overflow-y-auto flex-1 text-sm text-gray-600">
            <ng-content select="[modal-body]"></ng-content>
        </div>

        <div class="px-6 py-4 border-t border-gray-50 flex justify-end gap-5.5 bg-gray-50/50 rounded-b-2xl">
            <ng-content select="[modal-footer]"></ng-content>
        </div>
    </div>
</div>
}
