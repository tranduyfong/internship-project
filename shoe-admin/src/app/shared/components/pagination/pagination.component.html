<div class="flex items-center justify-between border-t border-gray-100 px-4 py-3 bg-white rounded-b-xl sm:px-6">
    <div class="flex flex-1 justify-between sm:hidden">
        <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1"
            class="relative inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50">Trước</button>
        <button (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPage"
            class="relative ml-3 inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50">Sau</button>
    </div>
    <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
        <div>
            <p class="text-sm text-gray-500">
                Hiển thị trang <span class="font-semibold text-gray-700">{{ currentPage }}</span> / <span
                    class="font-semibold text-gray-700">{{ totalPage }}</span> trang (Tổng <span
                    class="font-semibold text-gray-700">{{ totalItems }}</span> đơn)
            </p>
        </div>
        <div>
            <nav class="isolate inline-flex -space-x-px rounded-lg shadow-xs bg-white border border-gray-200"
                aria-label="Pagination">
                <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1"
                    class="relative inline-flex items-center rounded-l-lg px-2 py-2 text-gray-400 hover:bg-gray-50 focus:z-20 disabled:opacity-40">
                    <span class="sr-only">Trước</span>
                    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M12.79 5.23a.75.75 0 01-.02 1.06L8.83 10l3.94 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z"
                            clip-rule="evenodd" />
                    </svg>
                </button>

                <span
                    class="relative inline-flex items-center bg-indigo-600 px-4 py-2 text-sm font-semibold text-white focus:z-20">{{
                    currentPage }}</span>

                <button (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPage"
                    class="relative inline-flex items-center rounded-r-lg px-2 py-2 text-gray-400 hover:bg-gray-50 focus:z-20 disabled:opacity-40">
                    <span class="sr-only">Sau</span>
                    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M7.21 14.77a.75.75 0 01.02-1.06L11.17 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
            </nav>
        </div>
    </div>
</div>
