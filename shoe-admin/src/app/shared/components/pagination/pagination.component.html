<div class="flex items-center justify-between border-t border-gray-100 px-4 py-3.5 bg-white rounded-b-2xl sm:px-6">
    <div class="flex flex-1 justify-between sm:hidden">
        <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1"
            class="relative inline-flex items-center rounded-xl border border-gray-200 bg-white px-3 py-1.5 text-xs font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50 transition">
            Trước
        </button>
        <button (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPage"
            class="relative ml-3 inline-flex items-center rounded-xl border border-gray-200 bg-white px-3 py-1.5 text-xs font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50 transition">
            Sau
        </button>
    </div>

    <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
        <div>
            <p class="text-xs text-gray-500">
                Hiển thị <span class="font-semibold text-gray-700">{{ (currentPage - 1) * limit + 1 }}</span>
                - <span class="font-semibold text-gray-700">{{ Math.min(currentPage * limit, totalItems) }}</span>
                trên tổng <span class="font-semibold text-gray-700">{{ totalItems }}</span> bản ghi
            </p>
        </div>

        <div>
            <nav class="isolate inline-flex gap-1" aria-label="Pagination">
                <button (click)="goToPage(1)" [disabled]="currentPage === 1"
                    class="relative inline-flex items-center justify-center w-8 h-8 rounded-lg text-gray-400 hover:bg-gray-50 border border-gray-100 disabled:opacity-30 transition duration-150"
                    title="Trang đầu">
                    <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
                    </svg>
                </button>

                <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1"
                    class="relative inline-flex items-center justify-center w-8 h-8 rounded-lg text-gray-400 hover:bg-gray-50 border border-gray-100 disabled:opacity-30 transition duration-150"
                    title="Trang trước">
                    <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>

                @for (page of pages; track $index) {
                @if (page === '...') {
                <span
                    class="relative inline-flex items-center justify-center w-8 h-8 text-xs font-semibold text-gray-400 select-none">...</span>
                } @else {
                <button (click)="goToPage(page)"
                    [class]="page === currentPage 
                      ? 'relative z-10 inline-flex items-center justify-center w-8 h-8 rounded-lg bg-primary text-white text-xs font-bold shadow-xs transition duration-150' 
                      : 'relative inline-flex items-center justify-center w-8 h-8 rounded-lg text-gray-600 hover:bg-gray-50 border border-gray-100 text-xs font-semibold transition duration-150'">
                    {{ page }}
                </button>
                }
                }

                <button (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPage"
                    class="relative inline-flex items-center justify-center w-8 h-8 rounded-lg text-gray-400 hover:bg-gray-50 border border-gray-100 disabled:opacity-30 transition duration-150"
                    title="Trang tiếp">
                    <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>

                <button (click)="goToPage(totalPage)" [disabled]="currentPage === totalPage"
                    class="relative inline-flex items-center justify-center w-8 h-8 rounded-lg text-gray-400 hover:bg-gray-50 border border-gray-100 disabled:opacity-30 transition duration-150"
                    title="Trang cuối">
                    <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                    </svg>
                </button>
            </nav>
        </div>
    </div>
</div>
