<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-5">
    <div
        class="bg-white p-6 rounded-2xl border border-gray-100 flex items-center justify-between shadow-xs hover:shadow-md transition-all">
        <div class="space-y-1">
            <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Tổng doanh thu thu về</span>
            <h2 class="text-3xl font-bold text-gray-800">{{ +revenueSummary?.totalRevenue | number:'1.0-0' }} <span
                    class="text-sm font-medium text-gray-500">VND</span></h2>
        </div>
        <div class="p-3.5 bg-green-50 text-green-600 rounded-2xl border border-green-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                </path>
            </svg>
        </div>
    </div>

    <div
        class="bg-white p-6 rounded-2xl border border-gray-100 flex items-center justify-between shadow-xs hover:shadow-md transition-all">
        <div class="space-y-1">
            <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Tổng số lượng đơn hàng</span>
            <h2 class="text-3xl font-bold text-gray-800">{{ revenueSummary?.totalOrders }} <span
                    class="text-sm font-medium text-gray-500">Đơn hàng</span></h2>
        </div>
        <div class="p-3.5 bg-indigo-50 text-indigo-600 rounded-2xl border border-indigo-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
            </svg>
        </div>
    </div>
</div>
