<div class="space-y-6">
    <div
        class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-5 rounded-2xl border border-gray-100 shadow-xs">
        <div>
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Tổng quan hoạt động & Doanh thu</h1>
            <p class="text-sm text-gray-500 mt-0.5">Theo dõi chi tiết số liệu báo cáo của cửa hàng giày của bạn</p>
        </div>
        <select (change)="onRangeChange($event)"
            class="bg-gray-50 border border-gray-200 rounded-xl py-2 px-4 text-sm font-medium text-gray-700 outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
            <option value="day">Báo cáo Hôm nay</option>
            <option value="week">Báo cáo 1 Tuần qua</option>
            <option value="month" selected>Báo cáo 1 Tháng qua</option>
            <option value="quarter">Báo cáo 1 Quý gần nhất</option>
            <option value="year">Báo cáo Toàn bộ Năm</option>
        </select>
    </div>

    @if (isLoading) {
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white p-6 rounded-2xl border border-gray-100"><app-skeleton [lines]="2"></app-skeleton></div>
        <div class="bg-white p-6 rounded-2xl border border-gray-100"><app-skeleton [lines]="2"></app-skeleton></div>
    </div>
    <div class="bg-white p-6 rounded-2xl border border-gray-100"><app-skeleton [lines]="6"></app-skeleton></div>
    } @else {
    <app-summary-cards [revenueSummary]="revenueSummary"></app-summary-cards>

    <app-revenue-chart [chartData]="chartData"></app-revenue-chart>

    <app-status-stats [statusStats]="statusStats" (selectStatus)="handleStatusSelect($event)"></app-status-stats>

    @if (selectedStatus) {
    <app-status-detail-table [selectedStatus]="selectedStatus" [detailReceipts]="detailReceipts"
        [pagination]="pagination" [isDetailLoading]="isDetailLoading" (pageChange)="handleDetailPageChange($event)"
        (closeTable)="handleCloseTable()">
    </app-status-detail-table>
    }

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <app-top-products [productReport]="productReport"></app-top-products>
        <app-vip-customers [vipCustomers]="vipCustomers"></app-vip-customers>
    </div>
    }
</div>
