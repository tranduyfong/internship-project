<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md transition-all duration-300">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Đăng nhập Admin</h2>

        @if(errorMessage) {
        <div class="bg-red-100 text-red-600 p-3 rounded mb-4 text-sm">{{ errorMessage }}</div>
        }

        <form (ngSubmit)="onLogin()">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-semibold mb-2">Email</label>
                <input [(ngModel)]="email" name="email" type="email"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition"
                    placeholder="admin@example.com" required>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-semibold mb-2">Mật khẩu</label>
                <input [(ngModel)]="password" name="password" type="password"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition"
                    placeholder="••••••••" required>
            </div>

            <button type="submit" [disabled]="isLoading"
                class="w-full bg-primary hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition-colors flex justify-center">
                @if(isLoading) {
                <span class="animate-spin border-2 border-white border-t-transparent rounded-full w-5 h-5 mr-2"></span>
                Đang xử lý...
                } @else {
                Đăng nhập
                }
            </button>
        </form>
    </div>
</div>
