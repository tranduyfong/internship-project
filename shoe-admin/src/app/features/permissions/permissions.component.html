<div class="space-y-6">
    <div
        class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-5 rounded-2xl border border-gray-100 shadow-xs">
        <div>
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Quản lý quyền hạn</h1>
            <p class="text-sm text-gray-500 mt-0.5">Phân quyền trực tiếp cho nhân viên vận hành hệ thống</p>
        </div>

        <div class="relative w-full sm:w-80">
            <input type="text" [value]="searchTerm" (input)="onSearchInput($event)" placeholder="Tìm kiếm nhân viên..."
                class="w-full pl-10 pr-4 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition bg-gray-50/50 hover:bg-gray-50 focus:bg-white" />
            <div class="absolute left-3.5 top-2.5 text-gray-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
        </div>
    </div>

    <app-permission-table [staffList]="staffList" [pagination]="pagination" [isLoading]="isLoading"
        (pageChange)="onPageChange($event)" (managePermissions)="openPermissionsModal($event)">
    </app-permission-table>
</div>

<app-modal [isOpen]="isModalOpen" [title]="'Thiết lập quyền hạn nhân viên'" [size]="'lg'"
    (close)="closePermissionsModal()">
    <div modal-body class="space-y-6.5 py-1">
        <div class="bg-indigo-50/30 border border-indigo-100 p-4 rounded-xl">
            <p class="text-xs text-indigo-900 font-bold">Thông tin tài khoản phân quyền:</p>
            <p class="text-sm font-extrabold text-indigo-900 mt-1">{{ selectedStaff?.name }} <span
                    class="text-xs text-indigo-600 font-semibold ml-1.5">({{ selectedStaff?.email }})</span></p>
        </div>

        @if (isModalLoading) {
        <div class="space-y-4">
            <app-skeleton [lines]="4"></app-skeleton>
        </div>
        } @else {
        <div>
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-3">Tùy chọn danh mục quyền hạn</p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                @for (perm of systemPermissions; track perm.id) {
                <label (click)="togglePermission(perm.id)"
                    class="flex items-start gap-3 p-3.5 rounded-xl border border-gray-100 bg-gray-50/30 hover:bg-gray-50/70 transition-all duration-150 cursor-pointer select-none">

                    <input type="checkbox" [checked]="isPermissionSelected(perm.id)"
                        class="mt-1 h-4 w-4 rounded-md border-gray-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer" />

                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span
                                class="px-2 py-0.5 bg-gray-100 text-gray-700 rounded text-[9px] font-bold tracking-wide">
                                {{ perm.code }}
                            </span>
                        </div>
                        <p class="text-xs font-semibold text-gray-700 leading-normal">{{ perm.description }}</p>
                    </div>
                </label>
                }
            </div>
        </div>
        }
    </div>

    <div modal-footer>
        <button (click)="closePermissionsModal()"
            class="px-5 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold rounded-xl transition duration-150 mr-2">Hủy
            bỏ</button>
        <button (click)="savePermissions()"
            class="px-5 py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl transition duration-150 shadow-sm">Xác
            nhận Lưu</button>
    </div>
</app-modal>
