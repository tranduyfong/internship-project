<header
    class="bg-white h-16 border-b border-gray-100 flex items-center justify-between px-6 sticky top-0 z-40 shadow-xs">
    <div class="flex items-center gap-2">
        <span
            class="text-xs font-semibold bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full border border-indigo-100">Hệ
            Thống Quản Trị V4</span>
    </div>

    <div class="flex items-center gap-3">
        <div class="text-right">
            <p class="text-sm font-semibold text-gray-800">{{ adminName }}</p>
            <p class="text-xs text-green-500 font-medium flex items-center justify-end gap-1">
                <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> Hoạt động
            </p>
        </div>
        <div
            class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold shadow-md shadow-indigo-100 border border-indigo-200">
            {{ adminName.charAt(0) }}
        </div>
    </div>
</header>
